spring:
  datasource:
    url: "${TEST_DB_URL:jdbc:postgresql://127.0.0.1:5432/dfgg_test}"
    username: "${TEST_DB_USERNAME:dfgg}"
    password: "${TEST_DB_PASSWORD:dfgg}"
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  test:
    database:
      replace: none
riot:
  api:
    key: "test-riot-api-key"
    platform-base-url: "https://kr.api.riotgames.com"
    regional-base-url: "https://asia.api.riotgames.com"
mining:
  batch:
    match-page-size: 5
collection:
  scheduler:
    enabled: false
recommendation:
  recent-patch-window-size: 3
  counter:
    lift-smoothing-alpha: 1.0
    item-vocabulary-size: 159
  pair-synergy:
    minimum-pair-games: 5
  self-synergy:
    minimum-position-sample: 10
  candidate-top-k:
    build: 50
