spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: false

  datasource:
    url: "${TEST_DB_URL:jdbc:postgresql://127.0.0.1:5432/dfgg_test}"
    username: "${TEST_DB_USERNAME:dfgg}"
    password: "${TEST_DB_PASSWORD:dfgg}"
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  test:
    database:
      replace: none
riot:
  api:
    key: "test-riot-api-key"
    platform-base-url: "https://kr.api.riotgames.com"
    regional-base-url: "https://asia.api.riotgames.com"
mining:
  batch:
    match-page-size: 5
collection:
  scheduler:
    enabled: false
recommendation:
  # 픽스처가 EMERALD로 들어간다. 운영 기본값이 바뀌어도 테스트가 흔들리지 않도록 한다.
  v3:
    tiers: "EMERALD,DIAMOND,MASTER,GRANDMASTER,CHALLENGER"
  recent-patch-window-size: 3
  counter:
  pair-lift:
    smoothing-alpha: 1.0
    item-vocabulary-size: 159
  pair-synergy:
    minimum-pair-games: 5
  ally-synergy:
    minimum-base-rate: 0.02
  self-synergy:
    minimum-position-sample: 10
  candidate-top-k:
    build: 20
    self-synergy: 20
    ally-synergy: 20
    counter: 30
