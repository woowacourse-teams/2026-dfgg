spring:
  application:
    name: dfgg

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: "${DB_URL:jdbc:postgresql://127.0.0.1:5432/dfgg}"
    username: "${DB_USERNAME:tuise}"
    password: "${DB_PASSWORD:}"

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

riot:
  api:
    key: "${RIOT_API_KEY:}"
    platform-base-url: "${RIOT_PLATFORM_BASE_URL:https://kr.api.riotgames.com}"
    regional-base-url: "${RIOT_REGIONAL_BASE_URL:https://asia.api.riotgames.com}"
