spring:
  application:
    name: dfgg

  lifecycle:
    timeout-per-shutdown-phase: 30s

  config:
    import: "optional:file:.env[.properties]"

  # Boot가 주입하는 RestClient.Builder로 만드는 외부 클라이언트(Riot, Data Dragon)의 기본 timeout.
  # 수집 스케줄러는 advisory lock을 쥔 채 실행되므로, 응답이 멈추면 수집 전체가 재시작 전까지 멈춘다.
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 10s

  datasource:
    url: "${DB_URL:jdbc:postgresql://127.0.0.1:5432/dfgg}"
    username: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    postgresql:
      transactional-lock: false

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

riot:
  version: "${LEAGUE_OF_LEGENDS_VERSION:16.18}"
  api:
    key: "${RIOT_API_KEY:}"
    platform-base-url: "${RIOT_PLATFORM_BASE_URL:https://kr.api.riotgames.com}"
    regional-base-url: "${RIOT_REGIONAL_BASE_URL:https://asia.api.riotgames.com}"
    requests-per-second: "${RIOT_RATE_LIMIT_REQUESTS_PER_SECOND:18}"
    requests-per-two-minutes: "${RIOT_RATE_LIMIT_REQUESTS_PER_2_MINUTES:95}"

leaguepedia:
  base-url: "${LEAGUEPEDIA_BASE_URL:https://lol.fandom.com}"
  bot-username: "${LEAGUEPEDIA_BOT_USERNAME:}"
  bot-password: "${LEAGUEPEDIA_BOT_PASSWORD:}"
  user-agent: "${LEAGUEPEDIA_USER_AGENT:dfgg-pro-picks/1.0 (https://github.com/woowacourse-teams/2026-dfgg)}"
  # IP당 분당 5회 제한(실측)이라 요청 사이 12초를 둔다. ratelimited·maxlag는 30초부터 두 배씩 3번까지 다시 시도한다.
  request-interval: "${LEAGUEPEDIA_REQUEST_INTERVAL:12s}"
  retry-backoff: "${LEAGUEPEDIA_RETRY_BACKOFF:30s}"
  max-retries: "${LEAGUEPEDIA_MAX_RETRIES:3}"

pro-picks:
  # Leaguepedia OverviewPage 접두사(쉼표 구분). 국제전은 연도가 들어 있어 해마다 갱신한다.
  leagues: "${PRO_PICK_LEAGUES:2026 Season World Championship/,2026 Mid-Season Invitational,2026 First Stand,LCK/,LPL/,LEC/,LCS/,LCP/,CBLOL/}"
  lookback-days: "${PRO_PICK_LOOKBACK_DAYS:30}"

counter:
  # 적마다 보여줄 카운터 수. 데이터는 (적, 라인)마다 7개까지라 픽·밴으로 빠져도 채울 여유가 있다.
  picks-per-enemy: "${COUNTER_PICKS_PER_ENEMY:5}"
  today-picks: "${COUNTER_TODAY_PICKS:5}"

mining:
  batch:
    match-page-size: "${MINING_BATCH_MATCH_PAGE_SIZE:200}"

recommendation:
  component-ltr:
    model-path: "${COMPONENT_LTR_MODEL_PATH:}"
    policy-lookup-path: "${COMPONENT_LTR_POLICY_LOOKUP_PATH:}"
  situational:
    lookup-path: "${SITUATIONAL_LOOKUP_PATH:}"
    min-lift: "${SITUATIONAL_MIN_LIFT:2.0}"
    min-base-rate: "${SITUATIONAL_MIN_BASE_RATE:0.01}"
  recent-patch-window-size: "${RECOMMENDATION_RECENT_PATCH_WINDOW_SIZE:3}"
  rune:
    # 비우면 룬 기록의 최신 패치를 쓰고, 값을 넣으면 그 패치로 고정한다. 통계와 룬 이미지가 함께 따른다.
    patch: "${RUNE_RECOMMENDATION_PATCH:}"
    # 챔피언·포지션 판 수가 minimum-games보다 적으면 추천하지 않고, (핵심 룬, 보조 계열) 묶음이 minimum-path-games보다 적으면 고르지 않는다.
    minimum-games: "${RUNE_RECOMMENDATION_MINIMUM_GAMES:100}"
    minimum-path-games: "${RUNE_RECOMMENDATION_MINIMUM_PATH_GAMES:5}"
    page-count: "${RUNE_RECOMMENDATION_PAGE_COUNT:3}"
  counter:
    minimum-base-rate: "${RECOMMENDATION_COUNTER_MINIMUM_BASE_RATE:0.01}"
  pair-lift:
    smoothing-alpha: "${RECOMMENDATION_PAIR_LIFT_ALPHA:1.0}"
    item-vocabulary-size: "${RECOMMENDATION_PAIR_LIFT_ITEM_VOCABULARY_SIZE:159}"
  ally-synergy:
    # counter와 같은 이유의 하한. lift 분모가 바닥이면 한 판짜리 우연이 상위를 점령한다.
    # counter는 1%인데 ally는 2%다 — 실측으로 따로 정했다. 하한을 올릴수록 ally가 BUILD를
    # 베껴 Recall@5는 오르지만(8%에서 45%) BUILD 겹침이 41%가 된다. BUILD가 못 찾은 정답을
    # ally가 찾은 비율은 2~3%에서 2.43%로 꼭짓점을 찍고 내려온다. 2%가 lift 중앙(1.66)이
    # 더 높아 시너지 신호가 살아 있다.
    minimum-base-rate: "${RECOMMENDATION_ALLY_MINIMUM_BASE_RATE:0.02}"
  pair-synergy:
    minimum-pair-games: "${RECOMMENDATION_PAIR_SYNERGY_MIN_GAMES:5}"
  self-synergy:
    minimum-position-sample: "${RECOMMENDATION_SELF_SYNERGY_MIN_POSITION_SAMPLE:10}"
  candidate-top-k:
    build: "${RECOMMENDATION_CANDIDATE_TOP_K_BUILD:5}"
    self-synergy: "${RECOMMENDATION_CANDIDATE_TOP_K_SELF_SYNERGY:10}"
    ally-synergy: "${RECOMMENDATION_CANDIDATE_TOP_K_ALLY_SYNERGY:10}"
    counter: "${RECOMMENDATION_CANDIDATE_TOP_K_COUNTER:10}"
  v2-min-sample-count: "${RECOMMENDATION_V2_MIN_SAMPLE_COUNT:30}"
  v2-tiers: "${RECOMMENDATION_V2_TIERS:PLATINUM,EMERALD,DIAMOND,MASTER,GRANDMASTER,CHALLENGER}"
  v3:
    # 집계·export·서빙이 공유하는 티어. 정책이 바뀌면 여기만 바꾸고 재집계·재학습한다.
    tiers: "${RECOMMENDATION_V3_TIERS:EMERALD,DIAMOND,MASTER,GRANDMASTER,CHALLENGER}"

collection:
  scheduler:
    enabled: "${COLLECTION_SCHEDULER_ENABLED:false}"
    # 이전 실행이 끝난 뒤 이만큼 쉬고 다음 실행을 시작한다. Riot 호출 간격은 RiotRateLimitExecutor가 지킨다.
    fixed-delay: "${COLLECTION_SCHEDULER_FIXED_DELAY:10s}"
    tiers: "${COLLECTION_SCHEDULER_TIERS:PLATINUM}"
    divisions: "${COLLECTION_SCHEDULER_DIVISIONS:I}"
    player-page-size: "${COLLECTION_SCHEDULER_PLAYER_PAGE_SIZE:100}"
    player-limit: "${COLLECTION_SCHEDULER_PLAYER_LIMIT:1}"
    match-count: "${COLLECTION_SCHEDULER_MATCH_COUNT:20}"
    # 매치 ID를 이 기간 안의 경기로만 조회한다. 최근에 게임하지 않은 플레이어는 매치 ID 조회 1회로 끝난다.
    match-lookback: "${COLLECTION_SCHEDULER_MATCH_LOOKBACK:14d}"
    recover-missing-timelines: "${COLLECTION_SCHEDULER_RECOVER_MISSING_TIMELINES:false}"

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      minimum-expected-value:
        "[http.server.requests]": 10ms
      maximum-expected-value:
        "[http.server.requests]": 10s

logging:
  file:
    name: "${LOGGING_FILE_NAME:}"
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${DFGG_SLOT:local}] [%thread] %logger{36} traceId=%X{traceId:-none} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${DFGG_SLOT:local}] [%thread] %logger{36} traceId=%X{traceId:-none} - %msg%n"
  slow-request-threshold-millis: "${LOGGING_SLOW_REQUEST_THRESHOLD_MILLIS:1000}"

assets:
  s3:
    bucket: "${ASSETS_S3_BUCKET:}"
    region: "${ASSETS_S3_REGION:ap-northeast-2}"
