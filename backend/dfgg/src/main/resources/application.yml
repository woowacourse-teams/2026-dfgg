spring:
  application:
    name: dfgg

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: "${DB_URL:jdbc:postgresql://127.0.0.1:5432/dfgg}"
    username: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

riot:
  api:
    key: "${RIOT_API_KEY:}"
    platform-base-url: "${RIOT_PLATFORM_BASE_URL:https://kr.api.riotgames.com}"
    regional-base-url: "${RIOT_REGIONAL_BASE_URL:https://asia.api.riotgames.com}"

mining:
  batch:
    match-page-size: "${MINING_BATCH_MATCH_PAGE_SIZE:200}"

recommendation:
  identity-algorithm-version: "${RECOMMENDATION_IDENTITY_ALGORITHM_VERSION:checkpoint-a-4}"
  counter-algorithm-version: "${RECOMMENDATION_COUNTER_ALGORITHM_VERSION:checkpoint-c-1-counter}"
  pattern-algorithm-version: "${RECOMMENDATION_PATTERN_ALGORITHM_VERSION:checkpoint-d-1}"
  anchored-prefix-limit: "${RECOMMENDATION_ANCHORED_PREFIX_LIMIT:2}"
  total-candidate-count: "${RECOMMENDATION_TOTAL_CANDIDATE_COUNT:10}"
  prefix-backoff-threshold: "${RECOMMENDATION_PREFIX_BACKOFF_THRESHOLD:5}"
  safe-zone-ratio: "${RECOMMENDATION_SAFE_ZONE_RATIO:0.8}"
  wilson-weight: "${RECOMMENDATION_WILSON_WEIGHT:1.0}"
  my-champion-weight: "${RECOMMENDATION_MY_CHAMPION_WEIGHT:1.0}"
  ally-weight: "${RECOMMENDATION_ALLY_WEIGHT:1.0}"
  enemy-weight: "${RECOMMENDATION_ENEMY_WEIGHT:1.0}"

collection:
  scheduler:
    enabled: "${COLLECTION_SCHEDULER_ENABLED:false}"
    cron: "${COLLECTION_SCHEDULER_CRON:0 */5 * * * *}"
    zone: "${COLLECTION_SCHEDULER_ZONE:Asia/Seoul}"
    tiers: "${COLLECTION_SCHEDULER_TIERS:PLATINUM}"
    divisions: "${COLLECTION_SCHEDULER_DIVISIONS:I}"
    league-page-count: "${COLLECTION_SCHEDULER_LEAGUE_PAGE_COUNT:1}"
    player-page-size: "${COLLECTION_SCHEDULER_PLAYER_PAGE_SIZE:100}"
    match-count: "${COLLECTION_SCHEDULER_MATCH_COUNT:20}"