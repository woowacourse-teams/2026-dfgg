# 지연 분석용 nginx 접근 로그 형식.

# request_time : nginx가 요청을 받아 응답을 다 보낼 때까지 (클라이언트 구간 포함)
# upstream_time: 앱이 응답을 만드는 데 걸린 시간. 둘의 차이가 네트워크·버퍼링 구간이다.
#                nginx가 직접 응답하면(404 등) '-'로 남는다.
log_format dfgg '$remote_addr - [$time_local] "$request" '
                'status=$status bytes=$body_bytes_sent '
                'request_time=$request_time upstream_time=$upstream_response_time '
                'ua="$http_user_agent"';
