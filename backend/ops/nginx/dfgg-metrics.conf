# Prometheus 전용 스크랩 경로.
server {
    listen 9090;
    server_name _;
    server_tokens off;

    access_log off;
    error_log /var/log/nginx/error.log crit;

    # dfgg-be-monitoring
    allow 10.0.0.68;
    deny all;

    location = /blue  { proxy_pass http://127.0.0.1:8081/actuator/prometheus; }
    location = /green { proxy_pass http://127.0.0.1:8082/actuator/prometheus; }

    location = /node  { proxy_pass http://127.0.0.1:9100/metrics; }

    location / { return 404; }
}
