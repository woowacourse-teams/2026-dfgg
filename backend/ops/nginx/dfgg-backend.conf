# 앱 서버의 외부 진입점. 활성 슬롯은 dfgg-upstream.conf의 dfgg_backend가 가리킨다.
# 설치 위치: /etc/nginx/sites-available/dfgg-backend  (sites-enabled에 심볼릭 링크)
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log dfgg;

    location = /actuator {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://dfgg_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 관리 API는 인증이 없어 서버 안에서만 부른다. 헤더와 타임아웃은 위 설정을 물려받는다.
        location ^~ /admin/ {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://dfgg_backend;
        }

        # API 문서는 서버 안이거나 관리자 계정으로 로그인했을 때만 연다.
        # 계정 파일은 저장소에 두지 않고 서버에서 만든다. HTTP라 비밀번호가 평문으로 오간다.
        location ^~ /swagger-ui {
            satisfy any;
            allow 127.0.0.1;
            allow ::1;
            deny all;
            auth_basic "dfgg api docs";
            auth_basic_user_file /etc/nginx/dfgg-admin.htpasswd;
            proxy_pass http://dfgg_backend;
        }

        location ^~ /v3/api-docs {
            satisfy any;
            allow 127.0.0.1;
            allow ::1;
            deny all;
            auth_basic "dfgg api docs";
            auth_basic_user_file /etc/nginx/dfgg-admin.htpasswd;
            proxy_pass http://dfgg_backend;
        }
    }
}
