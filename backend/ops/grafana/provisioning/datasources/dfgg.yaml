# Grafana 데이터소스.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: dfgg-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      timeInterval: 30s
      httpMethod: POST
    editable: false

  - name: CloudWatch
    uid: dfgg-cloudwatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      defaultRegion: ap-northeast-2
      logGroups:
        - arn: /dfgg/prod
          name: /dfgg/prod
        - arn: /dfgg/dev
          name: /dfgg/dev
    editable: false
