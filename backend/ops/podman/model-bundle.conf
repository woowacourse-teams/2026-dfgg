# 모델 묶음을 쓰는 슬롯의 Component 경로. 슬롯의 /models가 묶음을 가리킬 때만
# be-deploy-container.yml이 dfgg@<슬롯>.container.d/model.conf로 설치한다.
# 컨테이너 환경 변수는 app-config/.env의 같은 키보다 우선한다.
[Container]
Environment=COMPONENT_LTR_MODEL_PATH=file:/models/component/model.json
Environment=COMPONENT_LTR_POLICY_LOOKUP_PATH=file:/models/component/component-policy-lookup.json
Environment=SITUATIONAL_LOOKUP_PATH=file:/models/component/situational-component-lookup.json
