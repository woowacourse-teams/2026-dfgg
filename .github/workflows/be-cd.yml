name: BE CD - EC2(BE/Dev)

on:
  push:
    branches: [ "BE/dev" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend/dfgg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy .env file
        run: cp ~/app-config/.env ./.env

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup and Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: ./backend/dfgg
          arguments: clean build --no-daemon -x test

      - name: Deploy with nohup
        run: |
          PID=$(pgrep -f "dfgg-.*\.jar" || true)
          if [ -n "$PID" ]; then
            echo "Stopping existing process: $PID"
            kill -15 $PID
            sleep 3
          fi
          
          BUILD_ID=dontKillMe nohup java -jar build/libs/dfgg-0.0.1-SNAPSHOT.jar </dev/null >app.log 2>&1 &
