name: BE CD - EC2(BE/Dev)

on:
  push:
    branches: [ "BE/dev" ]
  workflow_dispatch:

permissions:
  contents: read

# dev 자동 배포 → 검증, 승인 → prod 자동 배포.
jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/BE/dev'
    concurrency:
      group: dfgg-backend-deployment-dev
      cancel-in-progress: false
    uses: ./.github/workflows/be-deploy.yml
    with:
      runner-label: dfgg-dev
  verify-dev:
    needs: deploy-dev
    runs-on: [ self-hosted, dfgg-dev ]
    timeout-minutes: 15
    steps:
      - name: Soak and verify dev
        shell: bash
        env:
          SOAK_SECONDS: '300'
        run: |
          set -euo pipefail

          upstream=/etc/nginx/conf.d/dfgg-upstream.conf
          port=$(grep -oE '127\.0\.0\.1:[0-9]+' "$upstream" | cut -d: -f2)
          case "$port" in
            8081) slot=blue ;;
            8082) slot=green ;;
            *) echo "::error::Unexpected upstream port: $port"; exit 1 ;;
          esac
          unit="dfgg@${slot}.service"

          probe() {
            local target=$1 path=$2 filter=$3 code
            code=$(curl --noproxy '*' --connect-timeout 3 --max-time 15 -sS \
              -o /tmp/verify-dev.json -w '%{http_code}' "http://127.0.0.1:${target}${path}") || return 1
            [[ "$code" == 200 ]] || { echo "::error::$path returned $code"; return 1; }
            jq -e "$filter" /tmp/verify-dev.json > /dev/null
          }

          pid_before=$(systemctl show "$unit" -p MainPID --value)
          restarts_before=$(systemctl show "$unit" -p NRestarts --value)
          echo "watching $unit (pid=$pid_before, restarts=$restarts_before) for ${SOAK_SECONDS}s"

          probe "$port" /actuator/health/readiness '.status == "UP"'
          probe 8080 /v3/api-docs '(.openapi | type == "string") and (.paths | type == "object")'

          sleep "$SOAK_SECONDS"

          # 재시작은 systemd가 조용히 해준다. 겉으로는 정상이지만 앱은 죽었다 살아난 것이다.
          pid_after=$(systemctl show "$unit" -p MainPID --value)
          restarts_after=$(systemctl show "$unit" -p NRestarts --value)
          [[ "$(systemctl show "$unit" -p ActiveState --value)" == active ]] \
            || { echo "::error::$unit is not active after soak"; exit 1; }
          [[ "$pid_after" == "$pid_before" ]] \
            || { echo "::error::$unit restarted during soak ($pid_before -> $pid_after)"; exit 1; }
          [[ "$restarts_after" == "$restarts_before" ]] \
            || { echo "::error::$unit restart count grew ($restarts_before -> $restarts_after)"; exit 1; }

          probe "$port" /actuator/health/readiness '.status == "UP"'
          probe 8080 /v3/api-docs '(.openapi | type == "string") and (.paths | type == "object")'
          rm -f /tmp/verify-dev.json
          echo "dev is still healthy after ${SOAK_SECONDS}s; requesting approval for prod"

  approve-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Record approval
        run: echo "prod 배포 승인됨. 체류 검증이 끝나면 배포가 시작된다."

  deploy-prod:
    needs: [ approve-prod, verify-dev ]
    concurrency:
      group: dfgg-backend-deployment-prod
      cancel-in-progress: false
    uses: ./.github/workflows/be-deploy.yml
    with:
      runner-label: dfgg-prod

  notify-dev-failure:
    needs: [ deploy-dev, verify-dev ]
    if: ${{ always() && (contains(fromJSON('["failure","cancelled"]'), needs.deploy-dev.result) || contains(fromJSON('["failure","cancelled"]'), needs.verify-dev.result)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Notify Slack
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          DEPLOY_ENV: dev
          DEPLOY_STAGE: ${{ contains(fromJSON('["failure","cancelled"]'), needs.deploy-dev.result) && 'deploy' || 'verify' }}
          JOB_RESULT: ${{ contains(fromJSON('["failure","cancelled"]'), needs.deploy-dev.result) && needs.deploy-dev.result || needs.verify-dev.result }}
          RECOVERY: ${{ needs.deploy-dev.outputs.recovery }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/notify-deploy-failure.sh

  notify-prod-failure:
    needs: [ deploy-prod ]
    if: ${{ always() && contains(fromJSON('["failure","cancelled"]'), needs.deploy-prod.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Notify Slack
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          DEPLOY_ENV: prod
          DEPLOY_STAGE: deploy
          JOB_RESULT: ${{ needs.deploy-prod.result }}
          RECOVERY: ${{ needs.deploy-prod.outputs.recovery }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/notify-deploy-failure.sh
