name: be-image

# 서버가 받아 실행할 arm64 이미지를 만든다. PR에서는 빌드와 기동만 확인하고,
# BE/dev push에서만 GHCR에 올린다. 배포는 이 digest를 그대로 쓴다.
on:
  push:
    branches: [BE/dev]
    paths: ["backend/dfgg/**", ".github/workflows/be-image.yml"]
  pull_request:
    branches: [main, dev, BE/dev]
    paths: ["backend/dfgg/**", ".github/workflows/be-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: backend/dfgg

jobs:
  image:
    name: BE-IMAGE
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dfgg
          POSTGRES_PASSWORD: dfgg
          POSTGRES_DB: dfgg_boot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dfgg -d dfgg_boot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IMAGE: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v4

      - name: JAR 빌드
        run: ./gradlew bootJar --no-daemon

      - name: Podman 확인
        run: |
          set -euo pipefail
          command -v podman > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman; }
          podman --version

      - name: 이미지 빌드
        run: |
          set -euo pipefail
          podman build --platform linux/arm64 -f Containerfile \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE" .

      - name: 이미지 내용 확인
        run: |
          set -euo pipefail
          files=$(podman run --rm --entrypoint ls "$IMAGE" -A /app)
          [[ "$files" == "app.jar" ]] || { echo "::error::Unexpected files in /app: $files"; exit 1; }

      - name: 컨테이너 기동 확인
        run: |
          set -euo pipefail
          podman run -d --name boot-check --network host --memory 650m \
            -e SERVER_PORT=8081 \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=none \
            -e DB_URL=jdbc:postgresql://127.0.0.1:5432/dfgg_boot \
            -e DB_USERNAME=dfgg -e DB_PASSWORD=dfgg \
            -e RIOT_API_KEY=boot-check -e ASSETS_S3_BUCKET=boot-check \
            -e JAVA_TOOL_OPTIONS='-Xms128m -Xmx384m' \
            "$IMAGE"
          for attempt in $(seq 1 45); do
            if curl -fsS -m 3 http://127.0.0.1:8081/actuator/health/readiness | jq -e '.status == "UP"' > /dev/null; then
              echo "readiness UP"
              podman stop -t 35 boot-check > /dev/null
              exit 0
            fi
            [[ "$(podman inspect -f '{{.State.Running}}' boot-check)" == true ]] || break
            sleep 2
          done
          podman logs boot-check | tail -50
          echo "::error::Container did not become ready"
          exit 1

      - name: GHCR 푸시
        id: push
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE"
          digest=$(cat "$RUNNER_TEMP/digest")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed ${IMAGE%:*}@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
