name: BE Model Deploy

# 재학습을 통과한 모델 묶음을 배포한다 (U12). 재학습(be-retrain.yml)이 통과하면 이 워크플로를 건다. 사람이 다시 걸어도 된다.
# 확인 → dev, scheduling 배포와 5분 검증(be-cd) → prod 배포 승인 요청(be-cd target=prod) → Slack(비교 지표, 승인 링크).
# 이미지는 각 서버의 켜진 슬롯 것을 그대로 쓰고(image=current) 모델만 바꾼다. current.json은 prod 배포가 끝나면 be-cd가 바꾼다.
# 코드 배포(be-cd)가 줄을 서 있거나 돌고 있으면 건너뛴다. 다음 재학습이 더 새 모델로 다시 시도한다.
# dev 검증이 실패하면 dev, scheduling을 이전 묶음으로 되돌리고 prod로 가지 않는다.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "배포할 모델 묶음 (ltr-YYMMDD[-N])"
        required: true
        type: string
  # be-retrain.yml과 같은 이유로 BE/dev에서 이 파일이 바뀔 때 한 번 돌려 등록만 한다. 이때 잡은 모두 건너뛴다.
  push:
    branches: [ "BE/dev" ]
    paths: [ ".github/workflows/be-model-deploy.yml" ]

concurrency:
  group: dfgg-model-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_REF: BE/dev
  MODEL: ${{ inputs.model }}

jobs:
  # S3를 읽어야 해서 scheduling 러너(ec2-project)에서 한다.
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [ self-hosted, dfgg-scheduling ]
    timeout-minutes: 5
    outputs:
      status: ${{ steps.check.outputs.status }}
      previous: ${{ steps.check.outputs.previous }}
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          sparse-checkout: backend/ops/pipeline
      - name: Check the model bundle
        id: check
        run: backend/ops/pipeline/model-deploy-check.sh --model "$MODEL"

  # 코드 배포와 겹치지 않게 한다. be-cd의 dev, prod 잡은 환경마다 같은 concurrency 그룹이라 겹치면 줄을 서는데,
  # 그러면 모델 배포가 코드 배포 사이에 끼어든다. prod 승인만 기다리는 실행(waiting)은 dev 검증을 마친 상태라 겹치지 않는다.
  # push마다 승인되지 않은 실행이 몇 주씩 waiting으로 남으므로 그것까지 세면 모델 배포가 늘 건너뛰어진다.
  guard:
    needs: check
    if: needs.check.outputs.status == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      busy: ${{ steps.busy.outputs.busy }}
    steps:
      - name: Look for running deployments
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=""
          for status in queued in_progress requested pending; do
            found=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow be-cd.yml --status "$status" --limit 20 \
              --json databaseId --jq '.[].databaseId')
            runs="$runs $found"
          done
          runs=$(xargs <<< "$runs")
          if [[ -n "$runs" ]]; then
            echo "be-cd is running or waiting: $runs"
            echo "busy=$runs" >> "$GITHUB_OUTPUT"
          fi

  deploy-dev:
    needs: [ check, guard ]
    if: needs.guard.result == 'success' && needs.guard.outputs.busy == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          sparse-checkout: .github/scripts
      - name: Deploy to dev and scheduling, then soak dev for 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/dispatch-and-wait.sh be-cd.yml "$SOURCE_REF" -f image=current -f "model=$MODEL"

  # 검증에 실패한 모델이 dev, scheduling에 남지 않게 이전 묶음으로 되돌린다.
  rollback-dev:
    needs: [ check, deploy-dev ]
    if: ${{ always() && needs.deploy-dev.result == 'failure' && needs.check.outputs.previous != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          sparse-checkout: .github/scripts
      - name: Roll dev and scheduling back to the previous bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.check.outputs.previous }}
        run: .github/scripts/dispatch-and-wait.sh be-cd.yml "$SOURCE_REF" -f image=current -f "model=$PREVIOUS"

  request-prod:
    needs: [ check, deploy-dev ]
    if: needs.deploy-dev.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      url: ${{ steps.dispatch.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          sparse-checkout: .github/scripts
      - name: Request the prod deployment
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(.github/scripts/dispatch-and-wait.sh be-cd.yml "$SOURCE_REF" --no-wait \
            -f image=current -f target=prod -f "model=$MODEL" | tail -1)
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" >> "$GITHUB_OUTPUT"

  notify:
    needs: [ check, guard, deploy-dev, rollback-dev, request-prod ]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          sparse-checkout: .github/scripts
      - name: Compose message
        id: message
        env:
          CHECK: ${{ needs.check.result }}
          STATUS: ${{ needs.check.outputs.status }}
          PREVIOUS: ${{ needs.check.outputs.previous }}
          SUMMARY: ${{ needs.check.outputs.summary }}
          BUSY: ${{ needs.guard.outputs.busy }}
          GUARD: ${{ needs.guard.result }}
          DEV: ${{ needs.deploy-dev.result }}
          ROLLBACK: ${{ needs.rollback-dev.result }}
          PROD: ${{ needs.request-prod.result }}
          PROD_URL: ${{ needs.request-prod.outputs.url }}
        run: |
          set -euo pipefail
          level=notice
          if [[ "$PROD" == success ]]; then
            text="재학습 모델 $MODEL이 dev 5분 검증을 통과했습니다. 승인하면 prod에 배포됩니다(현재 $PREVIOUS)."$'\n'"<$PROD_URL|prod 배포 승인하러 가기>"
          elif [[ "$STATUS" == already ]]; then
            text="$MODEL은 이미 current.json의 모델이라 배포하지 않았습니다."
          elif [[ -n "$BUSY" ]]; then
            text="코드 배포(be-cd)가 줄을 서 있거나 진행 중이라 $MODEL 배포를 건너뛰었습니다: $BUSY. 다음 재학습에서 다시 시도하거나 be-model-deploy를 다시 거세요."
          elif [[ "$DEV" == failure ]]; then
            level=failure
            text="$MODEL의 dev 배포 또는 검증이 실패해 prod로 가지 않았습니다. 이전 묶음($PREVIOUS)으로 되돌리기: $ROLLBACK"
          else
            level=failure
            text="모델 배포가 끝나지 못했습니다. 확인 $CHECK, 겹침 확인 $GUARD, dev $DEV, prod 요청 $PROD"
          fi
          if [[ -n "$SUMMARY" ]]; then
            text="$text"$'\n'"$SUMMARY"
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
          { echo 'text<<TEXT_EOF'; echo "$text"; echo 'TEXT_EOF'; } >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          LEVEL: ${{ steps.message.outputs.level }}
          TITLE: 모델 배포
          MESSAGE: ${{ steps.message.outputs.text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/notify-pipeline.sh
