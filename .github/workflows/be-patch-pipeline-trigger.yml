name: BE Patch Pipeline Trigger

# 기본 브랜치(dev)에 두는 예약 트리거. GitHub 예약 실행은 기본 브랜치의 파일만 돌기 때문에 이 파일만 dev에 반영하고,
# 실제 파이프라인은 BE/dev의 be-patch-pipeline.yml을 재사용 워크플로로 불러 쓴다. 이 파일은 거의 바뀌지 않는다.
on:
  schedule:
    - cron: '0 18 * * *'   # 03:00 KST
  workflow_dispatch:
    inputs:
      retrain:
        description: "재학습: auto(화·토) | force(오늘 바로) | skip"
        required: false
        type: choice
        options: [ auto, force, skip ]
        default: auto
      skip-prod:
        description: "dev까지만 하고 prod는 건너뛴다"
        required: false
        type: boolean
        default: false

concurrency:
  group: dfgg-patch-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  pipeline:
    uses: woowacourse-teams/2026-dfgg/.github/workflows/be-patch-pipeline.yml@BE/dev
    with:
      retrain: ${{ inputs.retrain || 'auto' }}
      skip-prod: ${{ inputs.skip-prod || false }}
    secrets: inherit
