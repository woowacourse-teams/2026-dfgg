<!doctype html>
<!-- 언어별로 따로 만든다(webpack.config.js 의 PAGES). 검색 로봇이 JS 없이도 언어에 맞는 제목·설명을 읽는다. -->
<html lang="<%- lang %>">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%- title %></title>
    <meta name="description" content="<%- description %>" />
    <% if (canonical) { %>
    <link rel="canonical" href="<%- canonical %>" />
    <% } %>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DFGG" />
    <meta property="og:locale" content="<%- ogLocale %>" />
    <meta property="og:title" content="<%- title %>" />
    <meta property="og:description" content="<%- description %>" />
    <meta property="og:url" content="<%- url %>" />
    <meta property="og:image" content="https://dfgg.pro/og/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://techcourse-project-2026.s3.ap-northeast-2.amazonaws.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 첫 화면에서 가장 큰 그림(LCP)이다. JS 가 다 받아지기 전에 미리 받아 둔다. -->
    <link rel="preload" as="image" href="/media/gameplay-poster.webp" fetchpriority="high" />
    <!--
      본문 글꼴 CSS 가 그리기를 막지 않게 print 로 받았다가 다 받으면 all 로 바꾼다.
      그 사이에는 시스템 글꼴로 보인다(font-display: swap).
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
    </noscript>
    <link rel="icon" href="/icon.ico" />
    <link rel="alternate" hreflang="en" href="https://dfgg.pro/en/" />
    <link rel="alternate" hreflang="ko" href="https://dfgg.pro/ko/" />
    <link rel="alternate" hreflang="x-default" href="https://dfgg.pro/" />
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="93de5e12-4372-4120-82c0-deab98b3f33a"
      data-domains="dfgg.pro,www.dfgg.pro"
    ></script>
    <%= jsonLd %>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
