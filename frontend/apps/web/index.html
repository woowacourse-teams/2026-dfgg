<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFGG - 조합 맞춤 아이템 추천 데스크톱 앱</title>
    <meta
      name="description"
      content="게임이 시작되면 양 팀 챔피언과 산 아이템을 보고 다음 코어 아이템을 게임 화면에 띄워주는 리그 오브 레전드 데스크톱 앱이에요."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://techcourse-project-2026.s3.ap-northeast-2.amazonaws.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 첫 화면에서 가장 큰 그림(LCP)이다. JS 가 다 받아지기 전에 미리 받아 둔다. -->
    <link rel="preload" as="image" href="/media/gameplay-poster.webp" fetchpriority="high" />
    <!--
      본문 글꼴 CSS 가 그리기를 막지 않게 print 로 받았다가 다 받으면 all 로 바꾼다.
      그 사이에는 시스템 글꼴로 보인다(font-display: swap).
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
    </noscript>
    <link rel="icon" href="/icon.ico" />
    <link rel="alternate" hreflang="en" href="https://dfgg.pro/en" />
    <link rel="alternate" hreflang="ko" href="https://dfgg.pro/ko" />
    <link rel="alternate" hreflang="x-default" href="https://dfgg.pro/" />
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="93de5e12-4372-4120-82c0-deab98b3f33a"
      data-domains="dfgg.pro,www.dfgg.pro"
    ></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
